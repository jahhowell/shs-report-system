<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Report</title>
    <link rel="stylesheet" href="style.css">

<style>
.track-card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 10px 25px rgba(0,0,0,.08)}
.info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:16px 0}
.info-box{background:#f8fafc;padding:12px;border-radius:10px}
.timeline{border-left:3px solid #cbd5e1;padding-left:16px;margin-top:12px}
.timeline-item{margin-bottom:12px}
.photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-top:10px}
.photo-grid img{width:100%;height:120px;object-fit:cover;border-radius:8px;border:1px solid #ddd}
.copy-btn{margin-top:12px}
</style>


<style>
.report-hero-full{width:100%;margin:0 0 40px 0}
.report-hero-full .hero-block{border-radius:0!important;max-width:none!important;width:100%!important}
.report-hero-full .hero{min-height:340px!important;width:100%!important;max-width:none!important}
.track-container{max-width:1100px;margin:0 auto;padding:0 20px}
.track-card-wrap{max-width:900px;margin:0 auto}
</style>

</head>
<body>
<nav>
    <a class="nav-logo" href="index.html">
        <picture>
            <source srcset="assets/crest.png" type="image/png">
            <img class="crest" src="assets/crest.svg" alt="SHS crest" />
        </picture>
        <div style="line-height:1; margin-left:8px">
            <div style="font-weight:700">Sacred Heart School</div>
            <div style="font-size:12px; color:var(--muted);">Ateneo de Cebu</div>
        </div>
    </a>
    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="report.html">Submit report</a>
        <a href="track.html" class="active">Track report</a>
        <a href="admin-login.html">Admin</a>
    </div>
</nav>
    <div class="report-hero-full">
        

<section class="hero-block" style="border-radius:24px;overflow:hidden;margin-bottom:0;">
  <div class="hero" style="min-height:380px;padding:90px 20px;">
    
    <h1 style="margin:0 auto;text-align:center;">Track Your Report</h1>
    <p>Check the progress of your maintenance request using your report ID.</p>
  </div>
</section></div><div class="track-container"><div class="track-card-wrap"><div class="card" style="max-width:900px;margin:auto;border-radius:24px;box-shadow:0 20px 50px rgba(0,0,0,.12);padding:40px">
            <form id="track-form">
                <div class="form-group">
                    <label class="form-label">Report ID</label>
                    <input
                        id="reportId"
                        placeholder="Example: 6A3F8D219B2C" />
                </div>
                
                <button class="btn btn-primary" type="submit">
                    Track
                </button>
            </form>
            
            <div id="result" style="margin-top:20px"></div>
        </div></div></div>

    <script type="module">
        import { db } from "./firebase.js";
        import { collection, query, getDocs, orderBy }
            from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const form = document.getElementById("track-form");
        const input = document.getElementById("reportId");

        // Support Enter key
        input.addEventListener("keydown", e => { if(e.key === "Enter") { e.preventDefault(); form.dispatchEvent(new Event("submit")); } });

        function escapeHtml(str) {
            return String(str||'').replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[s]);
        }

        function statusBadge(s) {
            if(!s) return 'badge-pending';
            const k = s.toLowerCase();
            if(k.includes('progress')) return 'badge-progress';
            if(k.includes('resolved')) return 'badge-resolved';
            if(k.includes('reject')) return 'badge-rejected';
            return 'badge-pending';
        }

        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            const id = input.value.trim().toUpperCase();
            const result = document.getElementById("result");

            if(!id) {
                result.innerHTML = `<div class="alert alert-error" style="display:block">Please enter a Report ID.</div>`;
                return;
            }

            // Show loading spinner
            result.innerHTML = `
                <div style="text-align:center;padding:32px;color:#64748b;">
                    <div style="display:inline-block;width:32px;height:32px;border:3px solid #e2e8f0;border-top-color:#07294d;border-radius:50%;animation:spin 0.7s linear infinite;margin-bottom:12px;"></div>
                    <p style="font-size:14px;">Searching for your report…</p>
                </div>`;

            try {
                // Query only the specific document by ID prefix — much faster than fetching all
                const snapshot = await getDocs(collection(db, "reports"));
                let found = false;

                snapshot.forEach(doc => {
                    if(found) return; // stop after first match
                    if(doc.id.slice(0, 12).toUpperCase() !== id) return;

                    found = true;
                    const data = doc.data();
                    const badgeClass = statusBadge(data.status);
                    const dateStr = data.createdAt?.toDate ? data.createdAt.toDate().toLocaleString('en-PH') : 'Unknown';

                    const timelineHtml = (data.history && data.history.length > 0)
                        ? data.history.map(h => `
                            <div class="timeline-item">
                                <strong>${escapeHtml(h.status)}</strong><br>
                                <span style="font-size:13px;color:#64748b">${escapeHtml(h.time)}</span>
                            </div>`).join('')
                        : `<div class="timeline-item"><span style="color:#64748b;font-size:13px">No status updates yet. Check back soon.</span></div>`;

                    const photosHtml = data.photos?.length ? `
                        <h4 style="margin-top:20px">📸 Photos</h4>
                        <div class="photo-grid">
                            ${data.photos.map(p => `<img src="${p.url||p.data||p}" alt="Report photo">`).join('')}
                        </div>` : '';

                    const notesHtml = data.resolution
                        ? `<div style="background:#f0fdf4;border:1px solid #bbf7d0;border-radius:8px;padding:12px;color:#166534;font-size:13px;">${escapeHtml(data.resolution)}</div>`
                        : `<p style="color:#64748b;font-size:13px;">No resolution notes yet.</p>`;

                    result.innerHTML = `
                        <div class="card" style="margin-top:20px;">
                            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px;">
                                <h3 style="margin:0;font-size:17px;color:#07294d;">✅ Report Found</h3>
                                <span class="badge ${badgeClass}" style="font-size:12px;padding:5px 14px;">${escapeHtml(data.status||'Pending')}</span>
                            </div>

                            <div class="info-grid">
                                <div class="info-box"><strong>Location</strong><br>${escapeHtml(data.location||'N/A')}</div>
                                <div class="info-box"><strong>Category</strong><br>${escapeHtml(data.category||'N/A')}</div>
                                <div class="info-box"><strong>Student ID</strong><br>${escapeHtml(data.studentId||'N/A')}</div>
                                <div class="info-box"><strong>Submitted</strong><br>${dateStr}</div>
                            </div>

                            <h4 style="margin:16px 0 8px;">📋 Description</h4>
                            <p style="font-size:13px;color:#334155;background:#f8fafc;padding:10px 12px;border-radius:8px;">${escapeHtml(data.description||'No description.')}</p>

                            <h4 style="margin:16px 0 8px;">🕓 Progress Timeline</h4>
                            <div class="timeline">${timelineHtml}</div>

                            <h4 style="margin:16px 0 8px;">📝 Resolution Notes</h4>
                            ${notesHtml}

                            ${photosHtml}

                            <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:20px;">
                                <button class="btn btn-outline" onclick="navigator.clipboard.writeText('${id}').then(()=>{ this.textContent='✓ Copied!'; setTimeout(()=>this.textContent='Copy Report ID',2000); })">
                                    Copy Report ID
                                </button>
                                <button class="btn btn-primary" onclick="document.getElementById('result').innerHTML='';document.getElementById('reportId').value='';document.getElementById('reportId').focus();">
                                    Search Another
                                </button>
                            </div>
                        </div>`;
                });

                if(!found) {
                    result.innerHTML = `
                        <div class="alert alert-error" style="display:block;margin-top:16px;">
                            <strong>Report not found.</strong> Double-check your Report ID and try again.
                        </div>`;
                }

            } catch(err) {
                console.error(err);
                result.innerHTML = `
                    <div class="alert alert-error" style="display:block;margin-top:16px;">
                        Something went wrong. Please check your connection and try again.
                    </div>`;
            }
        });
    </script>
</body>
</html>
