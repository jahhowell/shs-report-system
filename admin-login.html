<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Admin Login — SHS-AdC</title>
    <link rel="stylesheet" href="style.css" />
    <style>
        body {
            background:
                radial-gradient(ellipse at 30% 20%, rgba(240,200,8,0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 70% 80%, rgba(7,41,77,0.08) 0%, transparent 50%),
                #f1f5f9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-wrap { width: 100%; max-width: 420px; }

        .login-card {
            background: #fff;
            border-radius: 20px;
            padding: 40px 36px;
            box-shadow: 0 24px 64px rgba(7,41,77,0.12), 0 4px 16px rgba(7,41,77,0.06);
            border: 1px solid rgba(7,41,77,0.06);
        }

        .login-header { text-align: center; margin-bottom: 32px; }

        .login-logo {
            width: 72px; height: 72px;
            border-radius: 18px;
            margin: 0 auto 16px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(7,41,77,0.15);
        }

        .login-logo img { width: 100%; height: 100%; object-fit: cover; }

        .login-header h1 {
            font-size: 22px;
            font-weight: 800;
            color: #07294d;
            margin-bottom: 4px;
            letter-spacing: -0.02em;
        }

        .login-header p { font-size: 13px; color: #64748b; }

        .form-group { margin-bottom: 16px; }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #07294d;
            margin-bottom: 7px;
        }

        .input-wrap { position: relative; }

        .input-icon {
            position: absolute;
            left: 13px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 15px;
            pointer-events: none;
        }

        input[type=text], input[type=password] {
            width: 100%;
            padding: 11px 14px 11px 40px;
            border: 1.5px solid rgba(7,41,77,0.12);
            border-radius: 10px;
            font-size: 14px;
            font-family: inherit;
            color: #07294d;
            background: #f8fafc;
            transition: all 0.18s;
        }

        input:focus {
            outline: none;
            border-color: #07294d;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(7,41,77,0.10);
        }

        .btn-login {
            width: 100%;
            padding: 13px;
            border-radius: 10px;
            border: none;
            background: #07294d;
            color: #fff;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            margin-top: 8px;
            font-family: inherit;
            transition: all 0.18s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 14px rgba(7,41,77,0.30);
            letter-spacing: -0.01em;
        }

        .btn-login:hover { background: #0a3b6d; box-shadow: 0 8px 24px rgba(7,41,77,0.35); transform: translateY(-1px); }
        .btn-login:active { transform: translateY(0); }
        .btn-login:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        .error-msg {
            background: #fff5f5;
            border: 1.5px solid #fed7d7;
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 13px;
            color: #c53030;
            margin-bottom: 16px;
            display: none;
            align-items: center;
            gap: 8px;
        }

        .divider {
            border: none;
            border-top: 1px solid rgba(7,41,77,0.07);
            margin: 24px 0 16px;
        }

        .footer-note {
            font-size: 12px;
            color: #94a3b8;
            text-align: center;
            line-height: 1.6;
        }

        .footer-note strong { color: #64748b; }

        /* Shake animation for wrong password */
        @keyframes shake {
            0%,100% { transform: translateX(0); }
            20%,60%  { transform: translateX(-6px); }
            40%,80%  { transform: translateX(6px); }
        }
        .shake { animation: shake 0.4s ease; }
    </style>
</head>
<body>
    <div class="login-wrap">
        <div class="login-card" id="login-card">
            <div class="login-header">
                <div class="login-logo">
                    <picture>
                        <source srcset="assets/crest.png" type="image/png">
                        <img src="assets/crest.svg" alt="SHS crest" />
                    </picture>
                </div>
                <h1>Admin Portal</h1>
                <p>Sacred Heart School – Ateneo de Cebu</p>
            </div>

            <div class="error-msg" id="error-msg">
                <span>🔒</span>
                <span id="error-text">Incorrect username or password.</span>
            </div>

            <div class="form-group">
                <label for="username">Username</label>
                <div class="input-wrap">
                    <span class="input-icon">👤</span>
                    <input type="text" id="username" placeholder="Enter username" autocomplete="username" />
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrap">
                    <span class="input-icon">🔑</span>
                    <input type="password" id="password" placeholder="Enter password" autocomplete="current-password" />
                </div>
            </div>

            <button class="btn-login" id="login-btn" onclick="login()">
                Sign in to Dashboard
            </button>

            <hr class="divider" />
            <p class="footer-note">
                Demo credentials — <strong>admin</strong> / <strong>test123</strong><br>
                For authorized personnel only.
            </p>
        </div>
    </div>

    <script>
        // Enter key support
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') login();
        });

        function login() {
            const username = document.getElementById('username').value.trim();
            const pw       = document.getElementById('password').value;
            const errMsg   = document.getElementById('error-msg');
            const card     = document.getElementById('login-card');
            const btn      = document.getElementById('login-btn');

            errMsg.style.display = 'none';

            if (!username || !pw) {
                document.getElementById('error-text').textContent = 'Please enter both username and password.';
                errMsg.style.display = 'flex';
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<span class="spinner" style="border-top-color:#fff;border-color:rgba(255,255,255,0.3);"></span> Signing in…';

            setTimeout(() => {
                if (username === 'admin' && pw === 'test123') {
                    localStorage.setItem('adminLoggedIn', 'true');
                    btn.innerHTML = '✓ Success! Redirecting…';
                    btn.style.background = '#166534';
                    setTimeout(() => location.href = 'admin.html', 500);
                } else {
                    errMsg.style.display = 'flex';
                    document.getElementById('error-text').textContent = 'Incorrect username or password.';
                    card.classList.add('shake');
                    setTimeout(() => card.classList.remove('shake'), 400);
                    document.getElementById('password').value = '';
                    btn.disabled = false;
                    btn.textContent = 'Sign in to Dashboard';
                    btn.style.background = '';
                }
            }, 600);
        }
    </script>
</body>
</html>
